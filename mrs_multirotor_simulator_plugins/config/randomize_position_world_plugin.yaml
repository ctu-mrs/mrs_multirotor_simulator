# example config for RandomizePositionWorldPlugin.
#
# keys must be nested under "world_plugin/<name>" (the name is whatever you listed it
# under "world_plugins", here "randomize_position").

world_plugin:
  randomize_position:

    # bounding box within which the uavs get randomized, centered on the origin (z is [0, bounds/z])
    bounds:
      x: 50.0
      y: 50.0
      z: 50.0
