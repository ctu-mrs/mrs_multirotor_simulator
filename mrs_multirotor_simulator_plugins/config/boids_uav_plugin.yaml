# example config for BoidsUavPlugin.
#
# keys must be nested under "uav_plugin/<uav_name>/<instance_name>" (the instance name is
# whatever you listed under "plugins" for that uav, here "boids") -- repeat once per uav.
# See mrs_multirotor_simulator/tmux/mrs_plugins_demo/custom_configs/simulator.yaml
# for a complete, working example.

uav_plugin:
  uav1:
    boids:

      # classic boids flocking gains
      separation_weight: 1.5
      alignment_weight: 1.0
      cohesion_weight: 1.0

      max_speed: 3.0 # [m/s]

      # local filtering distances within whatever neighbors were already provided
      # by the simulator's shared, dynamically-reconfigurable neighbor radius
      perception_radius: 10.0 # [m]
      separation_radius: 3.0  # [m]

      # shared attractor keeping the flock's mean altitude from drifting into the ground;
      # use the same cruise_altitude for every uav so they converge into one shared layer
      cruise_altitude: 5.0      # [m]
      altitude_bias_weight: 2.0
