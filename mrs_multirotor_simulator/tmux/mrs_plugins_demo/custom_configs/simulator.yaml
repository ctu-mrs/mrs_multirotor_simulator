# demo of the mrs_multirotor_simulator plugin interface: RandomizePositionWorldPlugin
# (trigger via rqt_reconfigure) plus BoidsUavPlugin + NeighborCountUavPlugin attached to
# every uav at once, spawned on a 5x5x2 grid so the flock forms in 3D

frames:
  fcu:
    publish_tf: true

dynamic:
  # boids fly close together by design, don't let hard-contact collisions destroy them
  collisions:
    enabled: false
    crash: false

  uav_plugins:
    neighbor_radius: 5.0 # [m], shared by all uavs, dynamically-reconfigurable

# | ------------------------- world plugin ------------------------ |

world_plugins: [
  "randomize_position"
]

randomize_position:
  address: "mrs_multirotor_simulator_plugins::RandomizePositionWorldPlugin"

# RandomizePositionWorldPlugin params, nested under "world_plugin/<name>"
world_plugin:
  randomize_position:
    bounds:
      x: 20.0
      y: 20.0
      z: 20.0

# | -------------------------- uav plugins -------------------------- |

boids:
  address: "mrs_multirotor_simulator_plugins::BoidsUavPlugin"

neighbor_counter:
  address: "mrs_multirotor_simulator_plugins::NeighborCountUavPlugin"

# BoidsUavPlugin params, nested under "uav_plugin/<uav_name>/<instance_name>", repeated
# per uav (NeighborCountUavPlugin needs no params, so it has no entries here)
uav_plugin:

  uav1:
    boids: &boids_gains
      separation_weight: 1.5
      alignment_weight: 1.0
      cohesion_weight: 1.0
      max_speed: 1.0
      perception_radius: 10.0
      separation_radius: 3.0
      cruise_altitude: 5.0
      altitude_bias_weight: 2.0
  uav2:
    boids: *boids_gains
  uav3:
    boids: *boids_gains
  uav4:
    boids: *boids_gains
